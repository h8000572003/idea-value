name: Release
# Every push to main publishes an EAP build to the Marketplace "eap" channel.
# Running this workflow manually on main publishes a stable release. See docs/RELEASE.md.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Stable version bump (auto: patch, or minor/major when a commit message contains [minor]/[major])'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      STABLE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # version.sh reads tags and history
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are published from main only (this run is on $GITHUB_REF_NAME)"
          exit 1

      - name: Compute version and change notes
        id: version
        run: |
          if [ "$STABLE" = "true" ]; then
            VERSION=$(.github/scripts/version.sh stable "${{ inputs.bump }}")
            if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::Tag v$VERSION already exists"
              exit 1
            fi
          else
            VERSION=$(.github/scripts/version.sh eap)
          fi
          mkdir -p build
          .github/scripts/version.sh notes > build/change-notes.html
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_pluginVersion=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_changeNotesFile=build/change-notes.html" >> "$GITHUB_ENV"
          {
            echo "### Values $VERSION ($([ "$STABLE" = "true" ] && echo stable || echo eap))"
            cat build/change-notes.html
          } >> "$GITHUB_STEP_SUMMARY"

      # verifyPlugin downloads several IDE versions
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test, build and verify plugin
        run: ./gradlew test buildPlugin verifyPlugin
      - name: Sign plugin
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        run: ./gradlew signPlugin
      - name: Upload plugin zip
        uses: actions/upload-artifact@v5
        with:
          name: plugin-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish to JetBrains Marketplace
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            if [ "$STABLE" = "true" ]; then
              echo "::error::Secret PUBLISH_TOKEN is not set"
              exit 1
            fi
            echo "::warning::Secret PUBLISH_TOKEN is not set; EAP build was not published"
            exit 0
          fi
          ./gradlew publishPlugin
      - name: Tag and create GitHub release
        if: env.STABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/distributions/*.zip \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file build/change-notes.html
