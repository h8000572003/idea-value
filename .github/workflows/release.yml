name: Release
# Push a tag v<pluginVersion> to publish. See docs/RELEASE.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to JetBrains Marketplace (otherwise only build, verify and upload the zip)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v5
      # verifyPlugin downloads several IDE versions
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(./gradlew properties -q --property version --no-configuration-cache | awk '/^version:/ {print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"
      - name: Check tag matches version
        if: env.IS_TAG == 'true'
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion ${{ steps.version.outputs.version }} in gradle.properties"
            exit 1
          fi

      - name: Test, build and verify plugin
        run: ./gradlew test buildPlugin verifyPlugin
      - name: Sign plugin
        if: env.CERTIFICATE_CHAIN != '' && env.PRIVATE_KEY != ''
        run: ./gradlew signPlugin
      - name: Upload plugin zip
        uses: actions/upload-artifact@v5
        with:
          name: plugin-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Publish to JetBrains Marketplace
        if: env.IS_TAG == 'true' || inputs.publish
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Secret PUBLISH_TOKEN is not set"
            exit 1
          fi
          ./gradlew publishPlugin
      - name: Create GitHub release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
