# Version for local builds and the first stable release. Releases compute the version from git tags
# (see .github/scripts/version.sh); this value is a floor, so raise it to force a version.
pluginVersion=1.10.0
# IntelliJ Platform version used to build and test the plugin
platformVersion=2024.1
# Earliest IDE build the plugin is compatible with
pluginSinceBuild=241
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
